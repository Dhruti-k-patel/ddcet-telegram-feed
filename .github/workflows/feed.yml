name: DDCET news feed

on:
  schedule:
    # Runs at 03:30 and 11:30 UTC  = 09:00 and 17:00 IST (twice a day).
    # Cron is in UTC. Adjust as you like: https://crontab.guru
    - cron: "30 3 * * *"
    - cron: "30 11 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

# Allow the workflow to commit the updated seen.json back to the repo.
permissions:
  contents: write

concurrency:
  group: ddcet-feed
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet seen.json; then
            git add seen.json
            git commit -m "Update seen notices [skip ci]"
            git push
          else
            echo "No new notices to record."
          fi
